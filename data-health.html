<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Data health | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc,only=false;
App.mount({page:'data-health',title:'Data health',roles:['admin'],render:function(ctx){
 var feeds=D.FEEDS,ok=feeds.filter(function(f){return f[5][0]==='ok';}).length,list=feeds.filter(function(f){return !only||f[5][0]!=='ok';});
 return '<div class="mb-8 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Data health</h1><p class="mt-2 text-sm text-mut">Check ingestion freshness and recent data delivery by company.</p></div><div class="seg" role="group" aria-label="Filter"><button type="button" data-o="0" aria-pressed="'+!only+'">All feeds</button><button type="button" data-o="1" aria-pressed="'+only+'">Issues only</button></div></div>'+
 '<section class="mb-6 grid gap-4 md:grid-cols-3"><div class="card p-5"><div class="text-xs text-cap">HEALTHY FEEDS</div><div class="metric mt-2">'+ok+' / '+feeds.length+'</div><div class="text-xs text-cap">Within the expected interval</div></div><div class="card p-5"><div class="text-xs text-cap">OLDEST UPDATE</div><div class="metric mt-2">2h 14m</div><div class="text-xs text-cap">Company 2 &middot; Trade feed</div></div><div class="card p-5"><div class="text-xs text-cap">LAST INGESTION</div><div class="metric mt-2">14:32</div><div class="text-xs text-cap">23 Oct 2026 &middot; UTC</div></div></section>'+
 '<section class="card overflow-x-auto"><table class="tbl min-w-[680px]"><tr><th>Company</th><th>Feed</th><th>Latest data</th><th>Expected</th><th>Records &middot; today</th><th>Status</th></tr>'+list.map(function(f){return '<tr><td>'+esc(D.COMPANIES[f[0]].name)+'</td><td>'+esc(f[1])+'</td><td>'+esc(f[2])+'</td><td>'+esc(f[3])+'</td><td class="mono">'+esc(f[4])+'</td><td>'+App.badge(f[5][0],f[5][1])+'</td></tr>';}).join('')+'</table>'+(list.length?'':'<p class="p-5 text-sm text-cap">No feed issues.</p>')+'</section>';
},after:function(ctx,main){main.querySelectorAll('[data-o]').forEach(function(b){b.addEventListener('click',function(){only=b.dataset.o==='1';ctx.refresh();});});}});
})();
</script></body></html>
