<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reports | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc;
App.mount({page:'reports',title:'Reports',roles:['client','multi','guest','admin'],scoped:true,render:function(ctx){
 var co=ctx.co;
 return '<div class="mb-8"><h1 class="page-title">Reports</h1><p class="mt-2 text-sm text-mut">Published liquidity reports for '+esc(co.name)+'.</p></div><section class="card overflow-x-auto"><table class="tbl min-w-[600px]"><tr><th>Report</th><th>Period</th><th>Published</th><th>Status</th><th></th></tr>'+D.REPORTS.map(function(r){return '<tr><td><strong>'+esc(r[0])+'</strong><div class="text-xs text-cap">PDF &middot; '+esc(co.name)+'</div></td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+App.badge('ok','Published')+'</td><td class="text-right"><a class="btn btn-s" href="'+r[3]+'" download>Download</a></td></tr>';}).join('')+'</table></section><p class="mt-3 text-xs text-cap">Sample PDFs: the prototype uses the same three files for every company.</p>';
}});
})();
</script></body></html>
