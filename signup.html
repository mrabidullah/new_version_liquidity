<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Create account | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div class="fixed right-4 top-4 z-10"><button type="button" data-theme-toggle class="btn !p-2" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="t-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><span class="t-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button></div><div class="auth-shell grid min-h-screen lg:grid-cols-[0.9fr_1.1fr]"><div class="hidden flex-col justify-between auth-panel p-10 text-white lg:flex xl:p-14"><div class="flex items-center gap-3"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1220"/></svg><span class="font-semibold tracking-[.14em]">DELTABLOCK</span></div><div><div class="mb-8 w-72"><svg viewBox="0 0 320 240" class="w-full" aria-hidden="true"><rect x="40" y="30" width="170" height="110" rx="14" fill="#fff" opacity=".1"/><path d="M55 120 90 90l30 20 40-45 35 25" fill="none" stroke="#F2B705" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="60" y="150" width="14" height="40" rx="3" fill="#fff" opacity=".25"/><rect x="84" y="136" width="14" height="54" rx="3" fill="#fff" opacity=".25"/><rect x="108" y="120" width="14" height="70" rx="3" fill="#F2B705" opacity=".8"/><rect x="132" y="142" width="14" height="48" rx="3" fill="#fff" opacity=".25"/></svg></div><h2 class="max-w-md text-3xl font-semibold leading-tight">Liquidity insight for listed companies.</h2><p class="mt-3 max-w-md text-[#AEB8CE]">Track volume, spread and participation in one secure workspace.</p></div></div><div class="auth-form-stage grid place-items-center p-5 sm:p-8 lg:p-10"><div class="auth-mobile-brand flex items-center gap-2"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1220"/></svg><b class="text-sm tracking-[.14em]">DELTABLOCK</b></div><div class="auth-form-card w-full max-w-md"><div id="su"></div></div></div></div><script src="js/data.js"></script><script src="js/app.js"></script><script>
(function(){
 var D=App.D,esc=App.esc,t=App.qs('t'),box=document.getElementById('su');
 function msg(title,text,extra){box.innerHTML='<h1 class="text-2xl font-semibold tracking-tight">'+title+'</h1><p class="mb-6 mt-2 text-sm text-mut">'+text+'</p>'+(extra||'')+'<a href="login.html" class="mt-5 inline-block text-sm text-mut underline">Back to sign in</a>';}
 var links=App.links(),people=App.people(),link=links.filter(function(l){return l.token===t;})[0],inv=people.filter(function(p){return p.token===t&&p.type==='colleague';})[0];
 var sample=links.filter(function(l){return l.status==='unused';})[0];
 if(!t||(!link&&!inv)){msg('This sign-up link is not valid','Sign-up links are personal and sent by Deltablock. Check that you opened the full link from your email, or ask us for a new one.',(sample?'<div class="persona-note">Prototype: <a class="underline" href="signup.html?t='+esc(sample.token)+'">open a sample client sign-up link</a></div>':'')+'<p class="mt-4 text-sm text-mut">Not a client yet? <a class="underline" href="login.html#request">Request access</a>.</p>');return;}
 var who,email,cos,kind,owner,tenant,intro;
 if(link){
  if(link.status==='used'){msg('This link was already used','An account was created with this link on '+esc(link.usedOn||'an earlier date')+'. Sign in instead, or ask Deltablock if you need another link.');return;}
  if(link.status==='expired'||Date.parse(link.expires)<Date.parse(D.TODAY)){msg('This link has expired','Sign-up links are valid for a limited time. Ask Deltablock to send you a new one.','<a class="btn btn-p w-full" href="mailto:support@deltablock.example?subject=New%20sign-up%20link">Ask for a new link</a>');return;}
  who=link.name;email=link.email;cos=link.companies;kind='client';owner=true;tenant=link.email;intro='Deltablock has set up your client account. Choose your name and password to get started.';
 } else {
  if(inv.status!=='pending'){msg('This invitation was already used','Sign in with your invited email.');return;}
  who=inv.name;email=inv.email;cos=inv.companies;kind='colleague';owner=false;tenant=inv.tenant;intro=esc(inv.invitedBy||'A colleague')+' invited you to join their team as a colleague. Choose your name and password to get started.';
 }
 box.innerHTML='<h1 class="text-2xl font-semibold tracking-tight">Create your account</h1><p class="mb-6 mt-1 text-sm text-mut">'+intro+'</p><form id="f" class="space-y-4"><div><label class="lbl" for="nm">Your name</label><input id="nm" class="inp" value="'+esc(who)+'" autocomplete="name" required></div><div><label class="lbl" for="em">Email</label><input id="em" class="inp" type="email" value="'+esc(email)+'" readonly></div><div><div class="lbl">Company access <span class="font-normal text-cap">(set by Deltablock, cannot be changed)</span></div><div class="space-y-2">'+cos.map(function(i){var c=D.COMPANIES[i];return '<div class="check-row !cursor-default"><span class="grid h-5 w-5 place-items-center rounded-full bg-[var(--okb)] text-[var(--ok)]" aria-hidden="true">&#10003;</span><b>'+esc(c.name)+'</b><span class="ml-auto text-xs text-cap">'+esc(c.exch)+'</span></div>';}).join('')+'</div></div><div><label class="lbl" for="pw">Password</label><input id="pw" type="password" class="inp" placeholder="At least 12 characters" minlength="12" autocomplete="new-password" required></div><div><label class="lbl" for="pw2">Confirm password</label><input id="pw2" type="password" class="inp" minlength="12" autocomplete="new-password" required></div><p id="err" class="hidden text-sm" style="color:var(--bad)" role="alert">The two passwords do not match.</p><button class="btn btn-p w-full !py-2.5">Create account</button></form><a href="login.html" class="mt-5 inline-block text-sm text-mut">Back to sign in</a>';
 document.getElementById('f').addEventListener('submit',function(e){e.preventDefault();
  if(document.getElementById('pw').value!==document.getElementById('pw2').value){document.getElementById('err').classList.remove('hidden');return;}
  var name=document.getElementById('nm').value.trim(),pl=App.people(),p=pl.filter(function(x){return x.email.toLowerCase()===email.toLowerCase();})[0];
  if(!p){p={id:'p'+Date.now(),email:email,type:kind,companies:cos.slice(),tenant:tenant,via:link?'Sign-up link':'Team invite'};pl.push(p);}
  p.name=name;p.status='active';p.type=kind;p.companies=cos.slice();p.tenant=tenant;if(kind==='client')p.owner=true;delete p.token;App.savePeople(pl);
  if(link){var ls=App.links();ls.forEach(function(l){if(l.token===link.token){l.status='used';l.usedOn=App.today();}});App.saveLinks(ls);}
  var role=cos.length>1?'multi':'client';
  App.setSession({role:role,name:name,email:email,companies:cos.slice(),owner:owner,tenant:tenant});
  location.href=App.ROLES[role].home;});
})();
</script></body></html>
