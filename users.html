<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Users | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc,filter='all',q='',editId=null,removeId=null;
function initials(n){return n.split(' ').map(function(x){return x[0];}).slice(0,2).join('').toUpperCase();}
function match(p){return filter==='all'||(filter==='admin'&&p.type==='admin')||(filter==='client'&&p.type==='client')||(filter==='colleague'&&p.type==='colleague')||(filter==='guest'&&p.type==='guest')||(filter==='pending'&&p.status==='pending');}
App.mount({page:'users',title:'Users',roles:['admin'],render:function(ctx){
 var all=App.people(),list=all.filter(function(p){return match(p)&&(!q||(p.name+' '+p.email).toLowerCase().indexOf(q.toLowerCase())>=0);});
 function n(f){var s=filter;filter=f;var c=all.filter(match).length;filter=s;return c;}
 function owner(p){var o=all.filter(function(x){return x.email===p.tenant&&x.owner;})[0];return o&&o.email!==p.email?o.name:'';}
 var rows=list.map(function(p){
  var adm=p.type==='admin',act=adm?'<span class="text-xs text-cap">Admin</span>':'<button class="btn btn-s" data-edit="'+p.id+'">Edit access</button> <button class="btn btn-s btn-d" data-remove="'+p.id+'">'+(p.status==='pending'?'Cancel':'Remove')+'</button>';
  return '<tr><td><div class="flex items-center gap-3"><span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-hov text-xs font-semibold text-mut">'+esc(initials(p.name))+'</span><div><div class="font-medium">'+esc(p.name)+'</div><div class="text-xs text-cap">'+esc(p.email)+'</div></div></div></td><td>'+App.badge(adm?'inf':'dr',App.typeLabel(p))+'</td><td>'+(adm?'<span class="text-cap">All companies</span>':App.chips(p.companies))+'</td><td class="text-mut">'+(owner(p)?'Team of '+esc(owner(p)):esc(p.via||'&mdash;'))+'</td><td>'+(p.status==='pending'?App.badge('warn','Pending'):App.badge('ok','Active'))+'</td><td class="whitespace-nowrap text-right">'+act+'</td></tr>';}).join('');
 return '<div class="mb-8 flex flex-wrap items-end justify-between gap-3"><div><h1 class="page-title">Users</h1><p class="mt-2 text-sm text-mut">Everyone with an account or a pending invitation. Clients manage their own colleagues and guests on their Team page.</p></div><a class="btn btn-p" href="signup-links.html">Create a client sign-up link</a></div>'+
 '<section class="card overflow-x-auto"><div class="flex flex-wrap items-center justify-between gap-3 border-b px-5 py-4"><div class="seg" role="group" aria-label="Filter">'+[['all','All'],['admin','Admins'],['client','Clients'],['colleague','Colleagues'],['guest','Guests'],['pending','Pending']].map(function(f){return '<button type="button" data-f="'+f[0]+'" aria-pressed="'+(f[0]===filter)+'">'+f[1]+' ('+n(f[0])+')</button>';}).join('')+'</div><input id="q" class="inp !w-64" type="search" placeholder="Search name or email" aria-label="Search users" value="'+esc(q)+'"></div><table class="tbl min-w-[860px]"><tr><th>Person</th><th>Type</th><th>Companies</th><th>Account</th><th>Status</th><th class="text-right">Actions</th></tr>'+rows+'</table>'+(list.length?'':'<p class="p-5 text-sm text-cap">No users match.</p>')+'</section>';
},extra:function(){
 var boxes=D.ORDER.map(function(i){return '<label class="check-row"><input type="checkbox" name="ed-co" value="'+i+'"> '+esc(D.COMPANIES[i].name)+' <span class="ml-auto text-xs text-cap">'+esc(D.COMPANIES[i].exch)+'</span></label>';}).join('');
 return '<div id="edit-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="et"><form id="edit-form" class="card w-full max-w-md"><div class="border-b px-6 py-4"><h2 id="et" class="font-semibold">Edit company access</h2><p id="edit-who" class="text-sm text-cap"></p></div><div class="space-y-2 p-6">'+boxes+'</div><div class="flex justify-end gap-2 border-t px-6 py-4"><button type="button" class="btn" data-close>Cancel</button><button class="btn btn-p">Save access</button></div></form></div><div id="remove-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="rt"><div class="card w-full max-w-md"><div class="border-b px-6 py-4"><h2 id="rt" class="font-semibold">Remove user</h2></div><p id="remove-text" class="p-6 text-sm text-mut"></p><div class="flex justify-end gap-2 border-t px-6 py-4"><button type="button" class="btn" data-close>Cancel</button><button id="remove-go" class="btn btn-p">Remove</button></div></div></div>';
},after:function(ctx,main,ov){
 var people=App.people();function find(id){return people.filter(function(p){return p.id===id;})[0];}
 main.querySelectorAll('[data-f]').forEach(function(b){b.addEventListener('click',function(){filter=b.dataset.f;ctx.refresh();});});
 var qi=main.querySelector('#q');qi.addEventListener('input',function(){q=qi.value;var pos=qi.selectionStart;ctx.refresh();var n=document.getElementById('q');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}});
 main.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){var p=find(b.dataset.edit);editId=p.id;ov.querySelector('#edit-who').textContent=p.name+' · '+App.typeLabel(p);ov.querySelectorAll('[name=ed-co]').forEach(function(c){c.checked=p.companies.indexOf(c.value)>=0;});App.openModal('edit-modal');});});
 ov.querySelector('#edit-form').addEventListener('submit',function(e){e.preventDefault();var cos=[].slice.call(ov.querySelectorAll('[name=ed-co]:checked')).map(function(c){return c.value;});if(!cos.length){App.toast('Choose at least one company');return;}find(editId).companies=cos;App.savePeople(people);App.closeModals();App.toast('Access updated');ctx.refresh();});
 main.querySelectorAll('[data-remove]').forEach(function(b){b.addEventListener('click',function(){var p=find(b.dataset.remove);removeId=p.id;ov.querySelector('#remove-text').textContent=(p.status==='pending'?'Cancel the invitation for ':'Remove ')+p.name+' ('+p.email+')? This cannot be undone.';App.openModal('remove-modal');});});
 ov.querySelector('#remove-go').addEventListener('click',function(){var p=find(removeId);App.savePeople(people.filter(function(x){return x.id!==removeId;}));App.closeModals();App.toast(p.name+' removed');ctx.refresh();});
}});
})();
</script></body></html>
