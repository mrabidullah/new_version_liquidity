<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access log | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head><body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script><script>
(function(){
 var D=App.D,esc=App.esc,people=D.ACCESS_LOG,total=1096,size=10,pages=Math.ceil(total/size),page=1;
 function stamp(i){var d=new Date(Date.UTC(2026,9,22,8,41)-i*7*60000);return new Intl.DateTimeFormat('en-GB',{weekday:'short',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true,timeZone:'UTC'}).format(d).replace(',','');}
 App.mount({page:'access-log',title:'Access log',roles:['admin'],render:function(){
  var start=(page-1)*size,end=Math.min(start+size,total),rows='',cards='';
  for(var i=start;i<end;i++){var p=people[i%people.length];
   rows+='<tr><td class="whitespace-nowrap">'+stamp(i)+'</td><td>'+esc(p[0])+'</td><td>'+esc(p[1])+'</td><td class="text-mut">'+esc(p[2])+'</td><td>'+esc(p[3])+'</td></tr>';
   cards+='<li class="access-log-item"><time class="access-log-date">'+stamp(i)+'</time><strong class="access-log-person">'+esc(p[0]+' '+p[1])+'</strong><span class="access-log-company">'+esc(p[3])+'</span><span class="access-log-email">'+esc(p[2])+'</span></li>';}
  return '<div class="mb-8"><h1 class="page-title">Access log</h1><p class="mt-2 text-sm text-mut">Who signed in, when, and which company they opened. Visible to admins only.</p></div><div class="card access-log-card overflow-x-auto"><table class="tbl access-log-table"><thead><tr><th scope="col">Date &amp; time</th><th scope="col">First name</th><th scope="col">Last name</th><th scope="col">Email</th><th scope="col">Company</th></tr></thead><tbody>'+rows+'</tbody></table><ul class="access-log-cards" aria-label="Access log entries">'+cards+'</ul>'+
   '<div class="access-log-footer flex flex-wrap items-center justify-between gap-3 border-t px-5 py-3 text-sm"><b>'+total.toLocaleString('en-GB')+' total</b><nav class="access-log-pagination flex items-center gap-2" aria-label="Access log pagination"><button data-p="first" class="btn !px-3 !py-1.5" type="button" aria-label="First page"'+(page===1?' disabled':'')+'>&laquo;</button><button data-p="prev" class="btn !px-3 !py-1.5" type="button" aria-label="Previous page"'+(page===1?' disabled':'')+'>&lsaquo;</button><span id="page-status" class="whitespace-nowrap px-2 text-mut" aria-live="polite">Page '+page+' of '+pages+'</span><button data-p="next" class="btn !px-3 !py-1.5" type="button" aria-label="Next page"'+(page===pages?' disabled':'')+'>&rsaquo;</button><button data-p="last" class="btn !px-3 !py-1.5" type="button" aria-label="Last page"'+(page===pages?' disabled':'')+'>&raquo;</button></nav></div></div>';
 },after:function(ctx,main){
  main.querySelectorAll('[data-p]').forEach(function(b){b.addEventListener('click',function(){var k=b.dataset.p;page=k==='first'?1:k==='last'?pages:k==='prev'?Math.max(1,page-1):Math.min(pages,page+1);ctx.refresh();});});
 }});
})();
</script></body></html>
