<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Overview | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc;
var PER={'24h':'24 hours','7d':'7 days','30d':'30 days'},PTS={'24h':12,'7d':7,'30d':30};
var per=App.store.get('period','30d');
function sgn(v,d){return (v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(d);}
App.mount({page:'dashboard',title:'Overview',roles:['client','multi','guest','admin'],scoped:true,render:function(ctx){
 var co=ctx.co,K=D.KPI[co.id],k=K[per],since=K.since,guest=ctx.role==='guest',pl=PER[per],sr=App.series(co.id,PTS[per]);
 var feedOk=co.feed[0]==='ok',timOk=k.tim>=co.timTarget,sprOk=k.spr<=co.sprTarget;
 var issues=[];if(!timOk)issues.push('Time in market is '+k.tim.toFixed(1)+'%, below the '+co.timTarget+'% target.');if(!sprOk)issues.push('Average spread is '+k.spr.toFixed(1)+' bps, above the '+co.sprTarget+' bps target.');if(!feedOk)issues.push('Trade data feed: '+co.feed[1].toLowerCase()+'. Figures may be incomplete until it catches up.');
 var banner=issues.length?'<div class="card mb-6 flex gap-3 border-l-4 p-4" style="border-left-color:#F2B705"><span class="bd warn shrink-0 self-start">Needs a look</span><ul class="text-sm text-mut">'+issues.map(function(i){return '<li>'+esc(i)+'</li>';}).join('')+'</ul></div>':'<div class="card mb-6 flex items-center gap-3 border-l-4 p-4" style="border-left-color:#146C34"><span class="bd ok">On target</span><span class="text-sm text-mut">Time in market and spread are both within target for the last '+pl+'.</span></div>';
 function card(label,val,unit,d,good,note,vals){return '<div class="card kpi-card p-4"><div class="metric-label">'+label+'</div><div class="metric mt-2">'+val+(unit?' <small class="metric-unit">'+unit+'</small>':'')+'</div><div class="mt-1 min-h-[1.25rem] text-xs text-cap">'+note+'</div><div class="mt-3 flex items-center justify-between gap-2"><span class="bd '+(good?'ok':'warn')+'">'+d+' vs prior '+per+'</span>'+App.spark(vals)+'</div></div>';}
 var kpis='<div class="mb-8 grid grid-cols-2 gap-4 lg:grid-cols-4">'+
  card('Time in market',k.tim.toFixed(1)+'%','',sgn(k.timD,1)+' pp',k.timD>=0,'Target '+co.timTarget+'% &middot; '+(timOk?'met':'not met'),sr.map(function(x){return x.s*-1;}))+
  card('Volume traded',App.num(k.vol),'shares',sgn(k.volD,1)+'%',k.volD>=0,'Across all venues',sr.map(function(x){return x.v;}))+
  card('Average spread',k.spr.toFixed(1),'bps',sgn(k.sprD,1)+' bps',k.sprD<=0,'Target &le; '+co.sprTarget+' bps &middot; '+(sprOk?'met':'not met'),sr.map(function(x){return x.s;}))+
  card('Turnover',k.turn.toFixed(2)+'%','',sgn(k.turnD,2)+' pp',k.turnD>=0,'Share of free float traded',sr.map(function(x,i){return x.v*(1+i/60);}))+'</div>';
 var pos=App.position(co.id,D.PEER_GROUPS[0]);
 var share=k.share,dash=(share/100*289).toFixed(1);
 var contrib='<section class="card p-5"><div class="mb-4 flex items-start justify-between gap-3"><div><h2 class="font-semibold">Deltablock contribution</h2><p class="text-sm text-cap">Share of all volume traded in '+esc(co.name)+', last '+pl+'</p></div></div><div class="flex flex-wrap items-center gap-6"><div class="relative shrink-0"><svg viewBox="0 0 120 120" class="h-28 w-28 -rotate-90" role="img" aria-label="Deltablock share of volume '+share+' percent"><circle cx="60" cy="60" r="46" fill="none" stroke-width="16" class="c-grid"/><circle cx="60" cy="60" r="46" fill="none" stroke-width="16" stroke-dasharray="'+dash+' 289" stroke-linecap="round" stroke="#F2B705"/></svg><div class="absolute inset-0 grid place-items-center text-lg font-semibold">'+share+'%</div></div><dl class="grid flex-1 grid-cols-2 gap-x-6 gap-y-3 text-sm"><div><dt class="text-xs text-cap">Since contract start</dt><dd class="font-semibold mono">'+since.share+'%</dd></div><div><dt class="text-xs text-cap">Active trading partners</dt><dd class="font-semibold mono">'+k.traders+' of '+since.traders+'</dd></div><div class="col-span-2"><a class="text-sm font-medium underline" href="'+(guest?'trades.html':'market.html')+'">'+(guest?'See the trade history':'See participation and daily spread')+' &rarr;</a></div></dl></div></section>';
 var peer='<section class="card p-5"><div class="mb-3 flex items-start justify-between gap-3"><div><h2 class="font-semibold">How you compare</h2><p class="text-sm text-cap">Against '+esc(D.PEER_GROUPS[0].name)+' &middot; anonymised &middot; last 30 days</p></div>'+(guest?'':'<a class="btn btn-s" href="comparison.html">Full comparison</a>')+'</div><ul>'+pos.map(function(p){return '<li class="flex items-center justify-between gap-3 border-t py-2.5 text-sm first:border-t-0"><span>'+esc(p.label)+'</span><span class="flex items-center gap-3"><span class="mono">'+esc(p.value)+'</span>'+App.badge(p.state[0],p.state[1])+'</span></li>';}).join('')+'</ul></section>';
 var rep=D.REPORTS[0],tix=App.tickets().filter(function(t){return t.company===co.id&&t.status!=='done';}),sub=App.subs()[co.id],days=App.daysUntil(sub.renewIso);
 function row(h,t,l,href){return '<li class="border-t py-3 first:border-t-0 first:pt-0"><div class="text-xs text-cap">'+h+'</div><div class="mt-0.5 text-sm font-medium">'+t+'</div><a class="text-sm text-mut underline" href="'+href+'">'+l+'</a></li>';}
 var latest='<section class="card p-5"><h2 class="mb-3 font-semibold">Latest</h2><ul>'+row('NEWEST REPORT',esc(rep[0])+' &middot; '+esc(rep[1]),'Open reports','reports.html')+(guest?'':row('SUPPORT',tix.length?tix.length+' open ticket'+(tix.length>1?'s':''):'No open tickets',tix.length?'View tickets':'Contact support','tickets.html')+row('SUBSCRIPTION',esc(sub.plan)+(days<=60?' &middot; renews in '+days+' days':' &middot; active'),'View subscription','subscription.html'))+'</ul></section>';
 var head='<div class="mb-6 flex flex-wrap items-end justify-between gap-4"><div><h1 class="page-title">Overview</h1><p class="mt-2 flex flex-wrap items-center gap-2 text-sm text-mut"><b class="text-ink">'+esc(co.name)+'</b><span>'+esc(co.exch)+' &middot; '+esc(co.code)+'</span><span class="mono text-ink">&euro;'+co.price.toFixed(3)+'</span>'+App.badge(co.feed[0],co.feed[1])+'<span class="text-cap">Latest data '+esc(co.last)+'</span>'+(guest?'<span class="chip">Read-only guest access</span>':'')+'</span></div><div class="seg" role="group" aria-label="Period">'+Object.keys(PER).map(function(p){return '<button type="button" data-per="'+p+'" aria-pressed="'+(p===per)+'">'+(p==='24h'?'24 hours':p==='7d'?'7 days':'30 days')+'</button>';}).join('')+'</div></div>';
 return head+banner+kpis+'<div class="grid gap-5 lg:grid-cols-3"><div class="space-y-5 lg:col-span-2">'+peer+contrib+'</div>'+latest+'</div>';
},after:function(ctx,main){
 main.querySelectorAll('[data-per]').forEach(function(b){b.addEventListener('click',function(){per=b.dataset.per;App.store.set('period',per);ctx.refresh();});});
}});
})();
</script></body></html>
