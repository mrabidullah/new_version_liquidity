<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Screen map | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc;
var NOTES={client:'One company. Signs up with a personal link from Deltablock. Owner of the account can manage the Team page.',multi:'Several companies behind one login. Lands on the company directory, then opens a company. The company switcher in the top bar changes every page.',guest:'Invited from a client’s Team page. Read-only, limited to the companies the client chose.',admin:'Deltablock staff. Sees everything, creates client sign-up links, reviews access requests, and can open any company workspace.'};
var ORDER=['client','multi','guest','admin'];
App.mount({page:'wireframes',title:'Screen map',roles:['admin'],render:function(ctx){
 var cards=ORDER.map(function(r){var R=App.ROLES[r];return '<section class="card p-5"><div class="mb-2 flex items-center justify-between gap-2"><h2 class="font-semibold">'+esc(R.label)+'</h2><span class="bd dr">Lands on '+esc(R.homeName)+'</span></div><p class="mb-3 text-sm text-mut">'+esc(NOTES[r])+'</p><ol class="mb-4 space-y-1 rounded-md bg-hov p-4 text-sm">'+App.NAV[r].map(function(n){return '<li><span class="mono text-xs text-cap">'+esc(n[0])+'</span> &nbsp;'+esc(n[1])+'</li>';}).join('')+'</ol><button class="btn btn-p" data-as="'+r+'">Open as '+esc(R.label.toLowerCase())+'</button></section>';}).join('');
 var sample=App.links().filter(function(l){return l.status==='unused';})[0],guest=App.people().filter(function(p){return p.type==='guest'&&p.status==='pending';})[0];
 function flow(t,steps,links){return '<div class="rounded-md border p-4"><strong>'+t+'</strong><ol class="mt-2 list-decimal space-y-1 pl-5 text-sm text-mut">'+steps.map(function(s){return '<li>'+s+'</li>';}).join('')+'</ol><div class="mt-3 flex flex-wrap gap-2">'+links.map(function(l){return '<a class="btn btn-s" href="'+l[1]+'">'+l[0]+'</a>';}).join('')+'</div></div>';}
 var flows='<section class="card mt-5 p-5"><h2 class="font-semibold">Join and access flows</h2><div class="mt-3 grid gap-4 md:grid-cols-2">'+
  flow('Client joins with a personal link',['Admin creates a link and picks one or several companies','Client opens the link and sees those companies (fixed)','Client chooses name and password and lands on their home page'],[['Admin: sign-up links','signup-links.html'],['Client view of a link',sample?'signup.html?t='+sample.token:'signup.html']])+
  flow('Someone asks for access',['Visitor fills in the Request access form on the login page','Request appears in Access requests on the admin side','Admin approves or rejects; approved requests get a sign-up link'],[['Login page form','login.html#request'],['Admin: access requests','access-requests.html']])+
  flow('Client invites colleagues and guests',['Account owner opens Team and picks role and companies','Invitee receives a personal link','Other team members can view the list but not change it'],[['Team page (as client)','#team'],['Guest invitation',guest?'guest-invite.html?t='+guest.token:'guest-invite.html'],['Admin: all users','users.html']])+
  flow('Password reset',['Login, then Forgot password','Enter email and get a confirmation message','Choose a new password from the emailed link'],[['Password reset','password-reset.html']])+'</div></section>';
 var over='<section class="card mt-5 p-5"><h2 class="font-semibold">What the Overview shows first</h2><p class="mt-1 text-sm text-mut">The old dashboard (tabs, KPIs, chart, donuts, daily spread) is split by purpose instead of kept as one long page.</p><div class="mt-3 grid gap-4 md:grid-cols-3"><div class="rounded-md border p-4 text-sm"><strong>Overview</strong><p class="mt-1 text-mut">Status banner, four headline numbers with targets and a 24h / 7d / 30d switch, how you compare with peers, Deltablock contribution, latest report, tickets and renewal.</p></div><div class="rounded-md border p-4 text-sm"><strong>Market activity</strong><p class="mt-1 text-mut">Price and volume chart, participation, daily spread. Detail for people who want to dig in.</p></div><div class="rounded-md border p-4 text-sm"><strong>Admin only</strong><p class="mt-1 text-mut">Access log (was Analytics), users, subscriptions, data health.</p></div></div></section>';
 return '<div class="mb-8"><h1 class="page-title">Screen map</h1><p class="mt-2 text-sm text-mut">Every role, its menu and its landing page. Use the buttons to click through the portal as that role; sign out returns to the login page.</p></div><div class="grid gap-5 lg:grid-cols-2">'+cards+'</div>'+flows+over;
},after:function(ctx,main){
 main.querySelectorAll('[data-as]').forEach(function(b){b.addEventListener('click',function(){location.href=App.login(b.dataset.as);});});
 var t=main.querySelector('a[href="#team"]');if(t)t.addEventListener('click',function(e){e.preventDefault();App.login('client');location.href='team.html';});
}});
})();
</script></body></html>
