<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Companies | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div id="root"></div><script src="js/data.js"></script><script src="js/app.js"></script>
<script>
(function(){
var D=App.D,esc=App.esc;
App.mount({page:'companies',title:'Companies',roles:['multi','admin'],render:function(ctx){
 var admin=ctx.role==='admin',ids=ctx.allowed,tot=0;ids.forEach(function(i){tot+=D.COMPANIES[i].vol30;});
 var rows=ids.map(function(i){var c=D.COMPANIES[i],s=App.subs()[i];return '<tr><td><strong>'+esc(c.name)+'</strong><div class="text-xs text-cap">'+esc(c.exch)+' &middot; '+esc(c.code)+'</div></td><td class="mono">'+App.num(c.vol30)+' <small class="metric-unit">shares</small></td><td class="mono">'+c.spread30.toFixed(1)+' <small class="metric-unit">bps</small></td><td>'+App.badge(c.feed[0],c.feed[1])+'</td><td>'+App.badge(s.status[0],s.status[1])+'</td><td class="text-right"><button class="btn btn-s" data-open-co="'+i+'">Open</button></td></tr>';}).join('');
 return '<div class="mb-8"><h1 class="page-title">Companies</h1><p class="mt-2 text-sm text-mut">'+(admin?'Every company on the platform. Open one to see its workspace as the client sees it.':'A combined view across your companies. Open one to see the workspace for that company.')+'</p></div><section class="mb-6 grid gap-4 md:grid-cols-3"><div class="card p-5"><div class="text-xs text-cap">COMPANIES</div><div class="metric mt-2">'+ids.length+'</div><div class="text-xs text-cap">Active subscriptions</div></div><div class="card p-5"><div class="text-xs text-cap">TOTAL VOLUME &middot; LAST 30 DAYS</div><div class="metric mt-2">'+App.num(tot)+' <small class="metric-unit">shares</small></div><div class="text-xs text-cap">Across '+(admin?'all':'your')+' companies</div></div><div class="card p-5"><div class="text-xs text-cap">LATEST DATA</div><div class="metric mt-2">23 Oct</div><div class="text-xs text-cap">14:32 UTC &middot; Company 1</div></div></section><section class="card overflow-x-auto"><table class="tbl min-w-[680px]"><tr><th>Company</th><th>Volume &middot; 30 days</th><th>Avg spread</th><th>Data status</th><th>Subscription</th><th></th></tr>'+rows+'</table></section>';
},after:function(ctx,main){main.querySelectorAll('[data-open-co]').forEach(function(b){b.addEventListener('click',function(){App.store.set('company',b.dataset.openCo);location.href='dashboard.html';});});}});
})();
</script></body></html>
