<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Reset password | Deltablock</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200&family=IBM+Plex+Mono:wght@500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><script src="js/theme.js"></script></head>
<body><div class="fixed right-4 top-4 z-10"><button type="button" data-theme-toggle class="btn !p-2" aria-label="Toggle dark mode" title="Toggle dark mode"><span class="t-moon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></span><span class="t-sun"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span></button></div><div class="grid min-h-screen place-items-center p-5"><section class="card w-full max-w-md p-8"><a href="login.html" class="inline-flex items-center gap-2.5 text-sm font-semibold tracking-[.14em]"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 30 29H2z" fill="#F2B705"/><path d="M16 12 21.5 23h-11z" fill="#0A1220"/></svg>DELTABLOCK</a><h1 class="page-title mt-8">Reset password</h1><p class="mb-6 mt-3 text-sm text-mut">Enter your account email. We will send a secure link to choose a new password.</p><form id="rf"><label class="lbl" for="email">Work email</label><input id="email" type="email" class="inp" placeholder="name@company.com" required><button class="btn btn-p mt-4 w-full">Send reset link</button></form><p id="sent" class="mt-4 hidden rounded-md bg-hov p-3 text-sm text-mut" role="status">If an account exists for this address, a reset link has been sent.</p><a href="login.html" class="mt-5 inline-block text-sm text-mut">Back to sign in</a></section></div><script>document.getElementById("rf").addEventListener("submit",function(e){e.preventDefault();document.getElementById("sent").classList.remove("hidden");});</script></body></html>
